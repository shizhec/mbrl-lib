env: "IsaacGymEnv"
term_fn: "no_termination"

num_steps: 400000
epoch_length: 500
num_elites: 5
num_epochs_train_model: 25
patience: 10
model_lr: 0.0003
model_wd: 5e-5
model_batch_size: 256
validation_ratio: 0.2
freq_train_model: 250
effective_model_rollouts_per_step: 400
rollout_schedule: [20, 150, 1, 25]
num_sac_updates_per_step: 20
sac_updates_every_steps: 1
num_epochs_to_retain_sac_buffer: 1

sac_gamma: 0.99
sac_tau: 0.005
sac_alpha: 0.2
sac_policy: "Gaussian"
sac_target_update_interval: 4
sac_automatic_entropy_tuning: false
sac_hidden_size: 1024
sac_lr: 0.0001
sac_batch_size: 256
sac_target_entropy: -1

isaac:
  task_name: KinovaPickAndReach
  sim_device: 'cuda:0'
  rl_device: 'cuda:0'
  graphics_device_id: 0
  headless: True
  force_render: False
  multi_gpu: False

  capture_video: False
  capture_video_freq: 1464
  capture_video_len: 100

  # if given, will override the device setting in gym. 
  task:
    name: KinovaFetch
    sub_task: "pick_and_reach"

    physics_engine: physx
    debug_vis: False
    test: False

    # if given, will override the device setting in gym. 
    env:
      numEnvs: 128
      episodeLength: 500
      random_reset: True
      enableDebugVis: False

      kinovaDofNoise: 0.15

      asset:
        assetRoot: "../../assets/urdf/kinova_description/urdf"
        assetFileNameKinova: "j2n6s300_gripper_clean.urdf"
        assetFileNameCylinder: "urdf/cylinder.urdf"

    sim:
      dt: 0.01667 # 1/60
      substeps: 2
      up_axis: "z"
      use_gpu_pipeline: True
      gravity: [0.0, 0.0, -9.81]
      physx:
        num_threads: 4
        solver_type: 1
        use_gpu: True # set to False to run on CPU
        num_position_iterations: 8
        num_velocity_iterations: 1
        contact_offset: 0.005
        rest_offset: 0.0
        # bounce_threshold_velocity: 0.2
        max_depenetration_velocity: 1000.0
        default_buffer_size_multiplier: 5.0
        max_gpu_contact_pairs: 1048576 # 1024*1024
        num_subscenes: 4
        contact_collection: 0 # 0: CC_NEVER (don't collect contact info), 1: CC_LAST_SUBSTEP (collect only contacts on last substep), 2: CC_ALL_SUBSTEPS (broken - do not use!)